<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b0573a">
  <title>Grande Tombola – Ticket à gratter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --terracotta: #b0573a;
  --terracotta-fonce: #8a3f25;
  --terracotta-clair: #d99476;
  --creme: #fbf4ea;
  --sable: #f1e2cf;
  --or: #c9a24a;
  --or-clair: #ecd491;
  --or-fonce: #9c7a2c;
  --brun: #4a2618;

  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: var(--sans);
  color: var(--creme);
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, .14), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(0, 0, 0, .16), transparent 70%),
    var(--terracotta);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 30px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- En-tête ---------- */
.header {
  text-align: center;
  margin-bottom: 30px;
  animation: monte .8s ease both;
}

.logo {
  display: block;
  width: 150px;
  max-width: 50%;
  height: auto;
  margin: 0 auto 22px;
  filter: drop-shadow(0 2px 4px rgba(74, 38, 24, .25));
}

.surtitre {
  font-size: .66rem;
  font-weight: 500;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--or-clair);
  opacity: .9;
}

.titre {
  margin-top: 8px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(2.5rem, 11.5vw, 3.3rem);
  line-height: 1;
  letter-spacing: .01em;
  background: linear-gradient(100deg, var(--or), #f6e3a6 45%, var(--or-clair) 60%, var(--or));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 3px rgba(74, 38, 24, .3));
}

.filet {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 140px;
  margin: 14px auto 12px;
}
.filet span { flex: 1; height: 1px; background: var(--or-clair); opacity: .6; }
.filet i {
  width: 6px; height: 6px;
  border: 1px solid var(--or-clair);
  transform: rotate(45deg);
}

.sous-titre {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.15rem;
  opacity: .92;
}

/* ---------- Ticket ---------- */
main { width: min(380px, 100%); }

.ticket {
  position: relative;
  background:
    radial-gradient(circle at 20% 0%, rgba(255, 255, 255, .7), transparent 50%),
    var(--creme);
  color: var(--brun);
  border-radius: 18px;
  padding: 18px 18px 14px;
  border: 1.5px solid var(--or);
  box-shadow:
    0 0 0 5px var(--creme),
    0 0 0 6px rgba(201, 162, 74, .8),
    0 26px 50px -10px rgba(60, 20, 8, .45);
  animation: monte .8s .15s ease both;
}

.ticket-haut {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--terracotta-fonce);
  margin-bottom: 14px;
}
#numero { font-weight: 500; color: var(--or-fonce); }

.zone {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(201, 162, 74, .5);
}

.grille {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  background: var(--sable);
}

.case {
  aspect-ratio: 1 / 1;
  background: var(--creme);
  border: 1px solid rgba(176, 87, 58, .35);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--terracotta);
  transition: transform .4s, background .4s, color .4s, box-shadow .4s;
}
.case svg { width: 58%; height: 58%; }

.case.gagnante {
  background: var(--terracotta);
  color: var(--or-clair);
  border-color: var(--or);
  box-shadow: 0 6px 14px -6px rgba(138, 63, 37, .7);
  transform: scale(1.04);
}

#couche {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}

/* ligne prédécoupée avec encoches */
.perfo {
  position: relative;
  margin: 16px -18px 12px;
  border-top: 2px dashed rgba(176, 87, 58, .3);
}
.perfo::before,
.perfo::after {
  content: "";
  position: absolute;
  top: -12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--terracotta);
}
.perfo::before { left: -13px; }
.perfo::after  { right: -13px; }

.regle {
  text-align: center;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.1rem;
  color: var(--terracotta-fonce);
}

/* ---------- Résultat ---------- */
.resultat {
  margin-top: 26px;
  text-align: center;
  background: linear-gradient(160deg, #96462b, var(--terracotta-fonce));
  border: 1px solid var(--or);
  border-radius: 16px;
  padding: 20px 18px 22px;
  box-shadow: 0 18px 36px -14px rgba(60, 20, 8, .5);
  animation: monte .6s ease both;
}

.resultat-titre {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 700;
  color: var(--or-clair);
}

.resultat-texte {
  margin-top: 4px;
  font-size: .9rem;
  line-height: 1.55;
  opacity: .95;
}

.resultat-code {
  display: inline-block;
  margin-top: 14px;
  padding: 8px 18px;
  border: 1px dashed var(--or-clair);
  border-radius: 8px;
  font-weight: 600;
  letter-spacing: .22em;
  font-size: 1.2rem;
  color: var(--or-clair);
}
.resultat-code:empty { display: none; }

@keyframes monte {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- Lots ---------- */
.lots { margin-top: 36px; }

.lots h2 {
  text-align: center;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 1.75rem;
  color: var(--or-clair);
  margin-bottom: 14px;
}

.lots-liste {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.lot {
  background: rgba(251, 244, 234, .1);
  border: 1px solid rgba(236, 212, 145, .45);
  border-radius: 14px;
  padding: 16px 6px 13px;
  text-align: center;
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.lot-nom { display: block; }

.lot-stock {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(251, 244, 234, .14);
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .04em;
  text-transform: none;
  color: var(--or-clair);
}
.lot-stock.epuise {
  background: rgba(60, 20, 8, .35);
  color: rgba(251, 244, 234, .7);
  text-decoration: line-through;
}

.compteur {
  text-align: center;
  font-size: .78rem;
  letter-spacing: .04em;
  opacity: .85;
  margin: -6px 0 14px;
  min-height: 1em;
}

.chargement {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #a8863f, #ecd8a0 45%, #c9a85c);
  color: #5c4114;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.2rem;
  z-index: 2;
}

.lot svg {
  width: 42px;
  height: 42px;
  color: var(--or-clair);
  display: block;
  margin: 0 auto 9px;
}

/* ---------- Pied de page ---------- */
.footer {
  margin-top: 30px;
  font-size: .72rem;
  line-height: 1.6;
  opacity: .75;
  text-align: center;
  max-width: 320px;
}

/* ---------- Confettis ---------- */
.confetti {
  position: fixed;
  top: -14px;
  width: 8px;
  height: 12px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 10;
  animation: chute linear forwards;
}

@keyframes chute {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>

            <path d="M27 35v20M30 35v22M34 35v22M37 35v20"/>
          </svg>`,
  },
  diamant: {
    svg: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 24l9-12h22l9 12-20 28z"/>
            <path d="M12 24h40M24 24l8 28 8-28M21 12l3 12M43 12l-3 12"/>
          </svg>`,
  },
  coeur: {
    svg: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 52S10 38 10 23a11 11 0 0 1 22-4a11 11 0 0 1 22 4c0 15-22 29-22 29z"/>
          </svg>`,
  },
};

const LOTS = ["bougie", "porteCle", "porteSac"];
const TOUS = Object.keys(DESSINS);
const CLE = "tombola-ticket-v2";

/* ---------- Sauvegarde (1 ticket par téléphone) ---------- */
const memoire = {
  lire()  { try { return JSON.parse(localStorage.getItem(CLE)); } catch (e) { return null; } },
  ecrire(v) { try { localStorage.setItem(CLE, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- Tirage ---------- */
function melanger(tab) {
  for (let i = tab.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tab[i], tab[j]] = [tab[j], tab[i]];
  }
  return tab;
}

function tirerLot() {
  const r = Math.random() * 100;
  let cumul = 0;
  for (const lot of LOTS) {
    cumul += CHANCES[lot];
    if (r < cumul) return lot;
  }
  return null;
}

// Remplit les 6 cases : 3 fois le lot gagné, ou aucun dessin 3 fois si perdu
function construireGrille(lotGagne) {
  const cases = [];
  const compte = {};
  if (lotGagne) {
    cases.push(lotGagne, lotGagne, lotGagne);
    compte[lotGagne] = 3;
  }
  while (cases.length < 6) {
    const d = TOUS[Math.floor(Math.random() * TOUS.length)];
    if (d === lotGagne) continue;
    if ((compte[d] || 0) >= 2) continue;
    compte[d] = (compte[d] || 0) + 1;
    cases.push(d);
  }
  return melanger(cases);
}

function genererCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s.slice(0, 3) + "-" + s.slice(3);
}

/* ---------- Base de données ---------- */
function avecDelai(promesse, ms, valeurSiTropLong) {
  return Promise.race([promesse, new Promise(r => setTimeout(() => r(valeurSiTropLong), ms))]);
}

// Crée les compteurs de stock s'ils n'existent pas encore
async function initialiserStock() {
  for (const lot of LOTS) {
    const ref = doc(db, "stock", lot);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      const n = STOCK_INITIAL[lot];
      await setDoc(ref, { total: n, restants: n }).catch(() => {});
    }
  }
}

// Retire 1 exemplaire du lot s'il en reste, et enregistre le code gagnant
function reserverLot(lot, code) {
  return runTransaction(db, async tx => {
    const ref = doc(db, "stock", lot);
    const snap = await tx.get(ref);
    if (!snap.exists() || snap.data().restants <= 0) return false;
    tx.update(ref, { restants: snap.data().restants - 1 });
    tx.set(doc(db, "gagnants", code), { lot, date: serverTimestamp() });
    return true;
  });
}

async function creerTicket() {
  const code = genererCode();
  let lot = tirerLot();
  if (lot) {
    // Si la base ne répond pas ou si le lot est épuisé : ticket perdant
    const ok = await avecDelai(reserverLot(lot, code).catch(() => false), 8000, false);
    if (!ok) lot = null;
  }
  setDoc(doc(db, "stats", "parties"), { total: increment(1) }, { merge: true }).catch(() => {});
  return {
    lot,
    cases: construireGrille(lot),
    code,
    numero: String(Math.floor(1000 + Math.random() * 9000)),
    gratte: false,
  };
}

/* ---------- Compteur affiché sur le site ---------- */
const stockActuel = {};
let partiesJouees = null;

function afficherCompteur() {
  for (const lot of LOTS) {
    const el = document.querySelector(`[data-stock="${lot}"]`);
    const st = stockActuel[lot];
    if (!el || !st) continue;
    el.textContent = st.restants > 0 ? `${st.restants} / ${st.total} restant${st.restants > 1 ? "s" : ""}` : "Épuisé";
    el.classList.toggle("epuise", st.restants <= 0);
  }
  const gagnes = LOTS.reduce((n, l) => n + (stockActuel[l] ? stockActuel[l].total - stockActuel[l].restants : 0), 0);
  const parts = [];
  if (partiesJouees !== null) parts.push(`${partiesJouees} ticket${partiesJouees > 1 ? "s" : ""} joué${partiesJouees > 1 ? "s" : ""}`);
  if (Object.keys(stockActuel).length) parts.push(`${gagnes} lot${gagnes > 1 ? "s" : ""} gagné${gagnes > 1 ? "s" : ""}`);
  document.getElementById("compteur").textContent = parts.join(" · ");
}

function ecouterCompteur() {
  for (const lot of LOTS) {
    onSnapshot(doc(db, "stock", lot), snap => {
      if (snap.exists()) { stockActuel[lot] = snap.data(); afficherCompteur(); }
    }, () => {});
  }
  onSnapshot(doc(db, "stats", "parties"), snap => {
    if (snap.exists()) { partiesJouees = snap.data().total; afficherCompteur(); }
  }, () => {});
}

/* ---------- Ticket ---------- */
document.getElementById("lots-liste").innerHTML = LOTS
  .map(l => `<div class="lot">${DESSINS[l].svg}<span class="lot-nom">${DESSINS[l].nom}</span><span class="lot-stock" data-stock="${l}">…</span></div>`)
  .join("");

await avecDelai(initialiserStock().catch(() => {}), 6000, null);
ecouterCompteur();

let ticket = memoire.lire();
if (!ticket) {
  ticket = await creerTicket();
  memoire.ecrire(ticket);
}
document.getElementById("chargement").remove();

/* ---------- Affichage ---------- */
document.getElementById("numero").textContent = "N° " + ticket.numero;

const grille = document.getElementById("grille");
grille.innerHTML = ticket.cases
  .map(d => `<div class="case" data-dessin="${d}">${DESSINS[d].svg}</div>`)
  .join("");

function afficherResultat(animation) {
  const bloc = document.getElementById("resultat");
  if (ticket.lot) {
    document.querySelectorAll(`.case[data-dessin="${ticket.lot}"]`)
      .forEach(c => c.classList.add("gagnante"));
    document.getElementById("resultat-titre").textContent = "Félicitations !";
    document.getElementById("resultat-texte").textContent =
      `Vous gagnez : ${DESSINS[ticket.lot].nom.toLowerCase()}. Présentez cet écran en boutique pour récupérer votre lot.`;
    document.getElementById("resultat-code").textContent = ticket.code;
    if (animation) confettis();
  } else {
    document.getElementById("resultat-titre").textContent = "Pas de chance…";
    document.getElementById("resultat-texte").textContent = "Ce ticket n'est pas gagnant. Merci d'avoir participé !";
  }
  bloc.hidden = false;
}

/* ---------- Couche à gratter ---------- */
const canvas = document.getElementById("couche");
const ctx = canvas.getContext("2d");
let termine = false;
let enCours = false;
let dernier = null;

function dessinerCouche() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const g = ctx.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, "#a8863f");
  g.addColorStop(.32, "#ecd8a0");
  g.addColorStop(.5, "#c9a85c");
  g.addColorStop(.75, "#f1e3b6");
  g.addColorStop(1, "#a8863f");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, r.width, r.height);

  // fines diagonales
  ctx.strokeStyle = "rgba(255,255,255,.16)";
  ctx.lineWidth = 1;
  for (let x = -r.height; x < r.width; x += 6) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + r.height, r.height); ctx.stroke();
  }
  // paillettes
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for (let i = 0; i < 120; i++) {
    ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 1.2, 1.2);
  }
  // cadre intérieur
  ctx.strokeStyle = "rgba(92,65,20,.35)";
  ctx.strokeRect(9.5, 9.5, r.width - 19, r.height - 19);

  ctx.fillStyle = "#5c4114";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "italic 600 34px 'Cormorant Garamond', serif";
  ctx.fillText("Grattez ici", r.width / 2, r.height / 2 - 8);
  ctx.font = "500 10px 'Montserrat', sans-serif";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  ctx.fillText("AVEC VOTRE DOIGT", r.width / 2, r.height / 2 + 22);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

  ctx.globalCompositeOperation = "destination-out";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 40;
  ctx.strokeStyle = "#000";
}

function position(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function gratter(e) {
  const p = position(e);
  ctx.beginPath();
  ctx.moveTo(dernier.x, dernier.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
  ctx.fill();
  dernier = p;
}

function verifier() {
  if (termine) return;
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let vide = 0, total = 0;
  for (let i = 3; i < data.length; i += 4 * 40) {
    total++;
    if (data[i] === 0) vide++;
  }
  if (vide / total > 0.55) {
    termine = true;
    canvas.style.transition = "opacity .5s";
    canvas.style.opacity = "0";
    setTimeout(() => canvas.remove(), 500);
    ticket.gratte = true;
    memoire.ecrire(ticket);
    setTimeout(() => afficherResultat(true), 400);
  }
}

canvas.addEventListener("pointerdown", e => {
  enCours = true;
  dernier = position(e);
  canvas.setPointerCapture(e.pointerId);
  gratter(e);
});
canvas.addEventListener("pointermove", e => { if (enCours) gratter(e); });
["pointerup", "pointercancel"].forEach(t =>
  canvas.addEventListener(t, () => { enCours = false; dernier = null; verifier(); })
);

/* ---------- Confettis ---------- */
function confettis() {
  const couleurs = ["#c9a24a", "#ecd491", "#fbf4ea", "#8a3f25", "#d99476"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = couleurs[i % couleurs.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

/* ---------- Démarrage ---------- */
if (ticket.gratte) {
  termine = true;
  canvas.remove();
  afficherResultat(false);
} else {
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(dessinerCouche);
}
</script>
